name: Build Cross-Platform Installers

on:
  push:
    tags:
      - 'v*'       # Trigger on version tags like v1.3.5
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write   # Needed to create releases

jobs:
  # ─── WINDOWS ────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r agent_app/requirements.txt

      - name: Build EXE with PyInstaller
        working-directory: agent_app
        run: |
          python -m PyInstaller ExamGuardrailAgent.spec --clean --noconfirm

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer with Inno Setup
        working-directory: agent_app
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ExamGuardrailSetup.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuardrailSetup-Windows
          path: agent_app/ExamGuardrailSetup.exe

  # ─── macOS ──────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r agent_app/requirements.txt
          # Install tkinter via brew (required on macOS)
          brew install python-tk@3.11 || true

      - name: Build .app with PyInstaller
        working-directory: agent_app
        run: |
          python -m PyInstaller ExamGuardrailAgent.spec --clean --noconfirm

      - name: Create DMG
        working-directory: agent_app
        run: |
          mkdir -p dmg_contents
          cp dist/ExamGuardrailAgent dmg_contents/
          cp icon.png dmg_contents/
          hdiutil create -volname "ExamGuardrail" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            dist/ExamGuardrailSetup-macOS.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuardrailSetup-macOS
          path: agent_app/dist/ExamGuardrailSetup-macOS.dmg

  # ─── LINUX ──────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r agent_app/requirements.txt

      - name: Build binary with PyInstaller
        working-directory: agent_app
        run: |
          python -m PyInstaller ExamGuardrailAgent.spec --clean --noconfirm

      - name: Create .deb package
        working-directory: agent_app
        run: |
          PKG_DIR=examguardrail_1.4.1-1_amd64
          mkdir -p $PKG_DIR/DEBIAN
          mkdir -p $PKG_DIR/usr/local/bin
          mkdir -p $PKG_DIR/usr/share/applications
          mkdir -p $PKG_DIR/usr/share/icons/hicolor/256x256/apps

          # Control file
          cat > $PKG_DIR/DEBIAN/control << 'EOF'
          Package: examguardrail
          Version: 1.4.1
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ExamGuardrail Team
          Description: ExamGuardrail Agent
           Monitors your PC for AI tools and cheating software during exams.
          EOF

          # Copy binary
          cp dist/ExamGuardrailAgent $PKG_DIR/usr/local/bin/examguardrail
          chmod +x $PKG_DIR/usr/local/bin/examguardrail

          # Copy icon
          cp icon.png $PKG_DIR/usr/share/icons/hicolor/256x256/apps/examguardrail.png

          # Desktop entry
          cat > $PKG_DIR/usr/share/applications/examguardrail.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=ExamGuardrail Agent
          Comment=Exam integrity monitoring agent
          Exec=examguardrail
          Icon=examguardrail
          Terminal=false
          Categories=Utility;Education;
          EOF

          # Build .deb
          dpkg-deb --build $PKG_DIR
          mv ${PKG_DIR}.deb dist/ExamGuardrailSetup-Linux.deb

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuardrailSetup-Linux
          path: agent_app/dist/ExamGuardrailSetup-Linux.deb

  # ─── CREATE GITHUB RELEASE ─────────────────────────────────────────────
  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ExamGuardrail ${{ github.ref_name }}"
          body: |
            ## ExamGuardrail Agent ${{ github.ref_name }}

            ### Downloads
            | Platform | File | Instructions |
            |----------|------|-------------|
            | 🪟 Windows | `ExamGuardrailSetup.exe` | Double-click to install |
            | 🍎 macOS | `ExamGuardrailSetup-macOS.dmg` | Open DMG, drag to Applications |
            | 🐧 Linux | `ExamGuardrailSetup-Linux.deb` | `sudo dpkg -i ExamGuardrailSetup-Linux.deb` |
          files: |
            release-assets/ExamGuardrailSetup-Windows/ExamGuardrailSetup.exe
            release-assets/ExamGuardrailSetup-macOS/ExamGuardrailSetup-macOS.dmg
            release-assets/ExamGuardrailSetup-Linux/ExamGuardrailSetup-Linux.deb
          draft: false
          prerelease: false

  # ─── UPLOAD TO SUPABASE STORAGE (for direct downloads) ─────────────────
  upload-to-storage:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Supabase Storage bucket
        run: |
          curl -s -f -S -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/bucket" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"id":"downloads","name":"downloads","public":true}' || true

      - name: Upload Windows installer
        run: |
          curl -f -S -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/downloads/ExamGuardrailSetup.exe" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/vnd.microsoft.portable-executable" \
            -H "x-upsert: true" \
            --data-binary @release-assets/ExamGuardrailSetup-Windows/ExamGuardrailSetup.exe

      - name: Upload macOS installer
        run: |
          curl -f -S -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/downloads/ExamGuardrailSetup-macOS.dmg" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/x-apple-diskimage" \
            -H "x-upsert: true" \
            --data-binary @release-assets/ExamGuardrailSetup-macOS/ExamGuardrailSetup-macOS.dmg

      - name: Upload Linux installer
        run: |
          curl -f -S -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/downloads/ExamGuardrailSetup-Linux.deb" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/vnd.debian.binary-package" \
            -H "x-upsert: true" \
            --data-binary @release-assets/ExamGuardrailSetup-Linux/ExamGuardrailSetup-Linux.deb

      - name: Verify uploads
        run: |
          echo "✅ Installers uploaded to Supabase Storage"
          echo "Windows: ${{ secrets.SUPABASE_URL }}/storage/v1/object/public/downloads/ExamGuardrailSetup.exe"
          echo "macOS: ${{ secrets.SUPABASE_URL }}/storage/v1/object/public/downloads/ExamGuardrailSetup-macOS.dmg"
          echo "Linux: ${{ secrets.SUPABASE_URL }}/storage/v1/object/public/downloads/ExamGuardrailSetup-Linux.deb"
